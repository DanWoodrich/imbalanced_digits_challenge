[project]
name = "digit-classification"
version = "0.0.4"
description = "Solution to the imbalanced digit classification problem using PyTorch Lightning."
readme = "README.md"
authors = [
    { name = "Daniel Woodrich", email = "d.woodrich1@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lightning>=2.5.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "typer>=0.15.0",
    "scikit-learn>=1.3.0",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
digit-classification = "digit_classification.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
